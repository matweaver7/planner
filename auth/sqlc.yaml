version: "2"
plugins:
  - name: py
    wasm:
      url: https://github.com/sqlc-dev/sqlc-gen-python/releases/download/v1.1.0/sqlc-gen-python_1.1.0.wasm
      sha256: "ef58f143a8c116781091441770c7166caaf361dd645f62b8f05f462e9f95c3b2"

sql:
  - engine: "postgresql"
    queries: "sql/queries/"
    schema: "sql/schema.sql"
    codegen:
      - out: "db"
        plugin: py
        options:
          driver: "asyncpg"
          emit_sync_querier: false
          emit_async_querier: true
          package: "db"
